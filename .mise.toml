# このリポジトリ固有の version pin だけを置く。
# 共有ツール（bun・uv・AI CLI・playwright など）と [settings]・ziku タスクは
# .config/mise/conf.d/shared.toml が持つ。
[tools]
node = ["22", "24"]
python = "3.14"
pnpm = "10"

[tasks.chromium-path]
run = "ls ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1"
description = "Get Playwright Chromium executable path"
